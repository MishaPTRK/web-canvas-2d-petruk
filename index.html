<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="style.css">
</head>



<body>
  <div class="app">
    <div class="tools">
      <button id="draw" class="active">D</button>
      <button id="erase">E</button>
      <button id="stamp">S</button>
      <button id="undo">↺</button>
      <button id="clear">C</button>
    </div>


    <div class="main">
      <div class="top">

        <span>min</span>
        <input id="size" type="range" min="1" max="50" value="5">
        <span>max</span>

        <input id="color" type="color" value="#000000">
      </div>


      <canvas width="700" height="500"></canvas>
    </div>

  </div>

  <script src="scripts.js"></script>

</body>
</html>
